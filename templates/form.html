{% extends "base.html" %}{% block content %}<h1>{{ 'Edit' if item_id else 'New' }} {{ table }}</h1><form class="panel form" method="post">{% for f in fields %}<label>{{ f|replace('_',' ')|title }}<input name="{{ f }}" value="{{ record.get(f,'') if record else '' }}" {% if f in ('check_in','check_out','payment_date') %}type="date"{% endif %} required></label>{% endfor %}<button class="button">Save</button> <a href="{{ url_for('listing',key=key) }}">Cancel</a></form>{% endblock %}

{% extends "base.html" %}{% block content %}<h1>{{ 'Edit' if item_id else 'New' }} {{ table }}</h1><form class="panel form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% for f in fields %}<label>{{ f|replace('_',' ')|title }}{% if (key,f) in field_choices %}<select name="{{ f }}" required>{% for choice in field_choices[(key,f)] %}<option value="{{ choice }}" {% if record and record.get(f)==choice %}selected{% endif %}>{{ choice }}</option>{% endfor %}</select>{% elif (key,f) in foreign_options %}<select name="{{ f }}" required><option value="">Choose...</option>{% for option in foreign_options[(key,f)] %}<option value="{{ option.id }}" {% if record and record.get(f)==option.id %}selected{% endif %}>{{ option.label }}</option>{% endfor %}</select>{% else %}<input name="{{ f }}" value="{{ record.get(f,'') if record else '' }}" {% if f in ('check_in','check_out','payment_date') %}type="date"{% endif %} required>{% endif %}</label>{% endfor %}<button class="button">Save</button> <a href="{{ url_for('listing',key=key) }}">Cancel</a></form>{% endblock %}

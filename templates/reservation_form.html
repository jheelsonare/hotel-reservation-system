{% extends "base.html" %}{% block content %}<h1>Book reservation</h1><form class="panel form" method="post"><label><input type="checkbox" name="new_guest" value="1"> Add a new guest to the database</label><label>Existing guest<select name="guest_id"><option value="">Choose an existing guest...</option>{% for c in guests %}<option value="{{ c.guest_id }}">{{ c.name }} (#{{ c.guest_id }})</option>{% endfor %}</select></label><p>For a new guest, select the checkbox above and complete these fields.</p><label>Guest name<input name="guest_name"></label><label>Phone<input name="guest_phone" inputmode="numeric"></label><label>Email<input name="guest_email" type="email"></label><label>City<input name="guest_city"></label><label>State<input name="guest_state"></label><label>ID proof type<input name="guest_id_proof_type"></label><label>ID proof number<input name="guest_id_proof_no"></label><label>Room type<select name="room_type_id" required><option value="">Choose a room type...</option>{% for room_type in room_types %}<option value="{{ room_type.type_id }}">{{ room_type.type_name }} - Rs {{ room_type.rent_per_day }}/day</option>{% endfor %}</select></label><label>Check in<input type="date" name="check_in" min="{{ today }}" required></label><label>Check out<input type="date" name="check_out" min="{{ today }}" required></label><button class="button">Book</button></form>{% endblock %}
